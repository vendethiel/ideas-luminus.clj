{% if comments|not-empty %}
  <b>{{comments|count}} comment{{comments|pluralize}}</b>
  {% for comment in comments %}
    <div class="idea-comment">
    <i>By <a href="/users/{{comment.user_id}}">{{comment.username}}</a> on {{comment.date}}</i>
    {% if comment.user_admin %}
        <p>{{comment.content|safe}}</p>
    {% else %}
        <p>{{comment.content}}</p>
    {% endif %}
    </div>
  {% endfor %}
{% endif %}
