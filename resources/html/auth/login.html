{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
  <h1>Log In</h1>

  {% include "_common/errors.html" %}

  <form action="/login" method="POST">
    {% csrf-field %}
    <div class="field">
      <label for="email">
        Email
      </label>
      <input type="text" name="email" value="{{email}}" />
    </div>

    <div class="field">
      <label for="email">
        Password
      </label>
      <input type="password" name="pass" />
    </div>

    <div class="field field-submit">
      <input type="submit" value="Log in" />
    </div>
  </form>
{% endblock %}
